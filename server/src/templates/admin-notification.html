<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: sans-serif;
            color: #333;
        }

        p {
            margin: 5px 0;
        }

        strong {
            color: #0056b3;
        }
    </style>
</head>

<body>
    <h3>🚀 Nuevo mensaje desde el Portafolio</h3>
    <p><strong>Nombre:</strong> {{name}}</p>
    <p><strong>Email:</strong> <a href="mailto:{{email}}">{{email}}</a></p>
    <p><strong>Asunto:</strong> {{subject}}</p>
    <hr>
    <p><strong>Mensaje:</strong></p>
    <p>{{message}}</p>
</body>

</html>
